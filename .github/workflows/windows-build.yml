name: Windows build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-exe:
    name: Build Windows x64 NSIS setup
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Setup Go 1.26.0
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.0'
          cache: false

      - name: Build pinned Surge (loopback, Windows x64)
        # Opt-in for the Windows startup diagnostic probe, gated by
        # SURGUI_CI_STARTUP_DIAGNOSTIC=1 (this step) plus GITHUB_ACTIONS=true
        # (set by the runner); intended for this GitHub-hosted workflow. When
        # either variable is absent the probe is skipped entirely.
        # The probe is comparison evidence only: process-tree cleanup is not
        # independently verified, so cleanup remains unverified until runner
        # teardown, and no full isolation is claimed.
        env:
          SURGUI_CI_STARTUP_DIAGNOSTIC: '1'
        run: pwsh -NoProfile -File scripts/build-surge-windows.ps1

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Targeted Windows SystemRoot comparison (test-only)
        # Controlled comparison: this separate cargo process opts in to
        # copying the real parent SystemRoot into the managed child env. The
        # opt-in is scoped to this step only, so the normal Rust test step
        # below keeps its original environment. Test output is discarded;
        # only fixed markers are printed, and no environment values are ever
        # echoed. Failures terminate the job (no later steps run) because
        # process-tree cleanup is unverified; the comparison is a separate
        # cargo process, not an in-process A/B comparison.
        working-directory: src-tauri
        timeout-minutes: 15
        env:
          SURGUI_TEST_WINDOWS_SYSTEMROOT: '1'
        run: |
          if ([string]::IsNullOrEmpty($env:SystemRoot) -or $env:GITHUB_ACTIONS -cne 'true' -or $env:SURGUI_TEST_WINDOWS_SYSTEMROOT -cne '1') {
            Write-Output "CI_DIAG:rust_with_systemroot_unknown"
            exit 1
          }
          $env:SURGUI_TEST_DAEMON = Join-Path $env:GITHUB_WORKSPACE "src-tauri/resources/surge-x86_64-pc-windows-msvc.exe"
          $Target = "managed_server::tests::windows_real_managed_daemon_coordinator_shutdown_reaps"
          if (-not (Test-Path $env:SURGUI_TEST_DAEMON)) { throw "missing staged daemon fixture" }
          $Listed = cargo test --lib -- --list 2>&1
          if ($LASTEXITCODE -ne 0) { throw "targeted test listing failed" }
          if (-not ($Listed -contains "${Target}: test")) { throw "targeted test not listed" }
          cargo test --lib managed_server::tests::windows_real_managed_daemon_coordinator_shutdown_reaps -- --exact --test-threads=1 *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "CI_DIAG:rust_with_systemroot_ok"
          } else {
            Write-Output "CI_DIAG:rust_with_systemroot_failed"
            exit $LASTEXITCODE
          }

      - name: Test Rust
        working-directory: src-tauri
        env:
          SURGUI_TEST_DAEMON: ${{ github.workspace }}/src-tauri/resources/surge-x86_64-pc-windows-msvc.exe
        run: |
          if (-not (Test-Path $env:SURGUI_TEST_DAEMON)) { throw "missing staged daemon fixture" }
          cargo test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Targets = @(
            "managed_server::tests::windows_real_managed_daemon_coordinator_shutdown_reaps"
          )
          $Listed = cargo test --lib -- --list 2>&1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($Target in $Targets) {
            if (-not ($Listed -contains "${Target}: test")) { throw "targeted test not listed" }
          }
          foreach ($Target in $Targets) {
            cargo test --lib $Target -- --exact --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Check Surge Tauri resources
        run: |
          if (-not (Test-Path src-tauri/resources/Surge-LICENSE)) { throw 'missing Surge-LICENSE resource' }
          if (-not (Test-Path src-tauri/resources/surge-x86_64-pc-windows-msvc.exe)) { throw 'missing surge Windows x64 resource' }
          Get-Item src-tauri/resources/* | Format-Table Name, Length | Out-String | Write-Host

      - name: Build Tauri NSIS setup
        run: npm run tauri build -- --bundles nsis

      - name: Upload NSIS setup artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: surge-desktop-windows-x64-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
